spring:
  cloud:
    gateway:
      default-filters:
        - TokenRelay=
        - RemoveRequestHeader=Cookie, Set-Cookie
      server:
        webflux:
          trusted-proxies: ".*" # TODO: This is too permissive. Fix this (or override in higher environments) before going to production.
          routes:
            - id: license-service
              uri: lb://license-service
              predicates:
                - Path=/api/v1/license/**
              filters:
                - RewritePath=/api/(?<path>.*), /$\{path}
            - id: organization-service
              uri: lb://organization-service
              predicates:
                - Path=/api/v1/organization/**
              filters:
                - RewritePath=/api/(?<path>.*), /$\{path}
            - id: config-service
              uri: lb://config-service
              predicates:
                - Path=/api/v1/config/**
              filters:
                - RewritePath=/api/v1/config/(?<path>.*), /$\{path}
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notification/**
              filters:
                - RewritePath=/api/(?<path>.*), /$\{path}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuers: ${GOOGLE_JWT_ISSUER_URI}, ${KEYCLOAK_JWT_ISSUER_URI}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      endpoint:
    gateway:
      access: read_only
eureka:
  instance:
    preferIpAddress: true
    leaseRenewalIntervalInSeconds: 20
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8070/eureka}
logging:
  level:
    com.optimagrowth: DEBUG
security:
  cors:
    allowedOrigins: http://localhost:4200, http://angular-frontend.ostock/ # TODO: Only for development. Override this for higher environments
    allowedMethods: "*"
    allowedHeaders: "*"
  authorization:
    allowedEndpoints: /actuator/health/liveness, /actuator/health/readiness
